<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>틀린그림찾기</title>
<meta name="description" content="두 그림에서 다른 곳을 모두 찾아보세요. 그림마다 기록 도전.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/diff.css">
</head>
<body>
<main id="app" class="sd">

  <header class="topbar">
    <a href="/" class="ghost back">← 홈</a>
    <h1 class="sd-title"><span aria-hidden="true">🔍</span> 틀린그림찾기</h1>
    <span id="progress-chip" class="chip" hidden></span>
  </header>

  <!-- 그림 고르기 -->
  <section id="controls" class="sd-controls">
    <p class="muted sd-help">그림을 골라 시작하세요. 두 그림에서 다른 곳을 찾아 아무 쪽이나 누르면 돼요 — 오답은 +5초, 힌트는 +20초.</p>
    <div id="gallery" class="sd-gallery" aria-label="그림 고르기"></div>
  </section>

  <!-- 판 -->
  <section id="stage" hidden>
    <div class="sd-bar">
      <button id="btn-pick" class="ghost small" type="button">← 그림 고르기</button>
      <span class="sd-stat sd-count"><b id="found-count">0</b> / <span id="total-count">0</span></span>
      <span class="sd-stat" id="timer">0:00</span>
      <span class="sd-stat muted" id="miss-count" title="오답 한 번에 +5초">오답 0</span>
      <span class="spacer"></span>
      <button id="btn-hint" class="secondary small" type="button">💡 힌트 <small>+20초</small></button>
      <button id="btn-zoom" class="secondary small" type="button" aria-pressed="false">🔍 확대</button>
      <button id="btn-big" class="secondary small" type="button" aria-pressed="false" title="두 그림을 위아래로, 화면 폭 가득">↕ 크게 보기</button>
      <button id="btn-full" class="secondary small" type="button" aria-pressed="false" title="전체화면">⛶ 전체화면</button>
    </div>

    <div id="pair" class="sd-pair">
      <div class="sd-pane" data-side="left">
        <div class="sd-wrap"><div class="sd-pic"><img class="sd-img" alt="" draggable="false"><svg class="marks" aria-hidden="true"></svg></div></div>
        <span class="sd-tag">왼쪽</span>
      </div>
      <div class="sd-pane" data-side="right">
        <div class="sd-wrap"><div class="sd-pic"><img class="sd-img" alt="" draggable="false"><svg class="marks" aria-hidden="true"></svg></div></div>
        <span class="sd-tag">오른쪽</span>
      </div>
    </div>

    <div id="result" class="panel sd-result" hidden>
      <div class="result win">다 찾았어요! 🎉</div>
      <p id="result-text"></p>
      <p id="result-best" class="muted"></p>
      <div class="row center">
        <button id="btn-next" class="primary" type="button">다음 그림 →</button>
        <button id="btn-again" class="secondary" type="button">다시 하기</button>
      </div>
    </div>
  </section>

  <!-- 정답 편집기 (/diff?edit=1) -->
  <section id="editor" class="panel sd-editor" hidden>
    <h2>정답 편집기</h2>
    <p class="muted">그림(아무 쪽)을 누르면 그 자리에 정답 원이 추가되고, 이미 있는 원을 누르면 지워져요. 다 되면 JSON 을 복사해 <code>public/diff/puzzles.json</code> 에 넣으세요.</p>
    <div class="row">
      <label class="field"><span>반지름</span><input id="ed-r" type="number" min="14" max="160" step="1" value="40"></label>
      <button id="ed-undo" class="secondary" type="button">되돌리기</button>
      <button id="ed-copy" class="primary" type="button">JSON 복사</button>
    </div>
    <textarea id="ed-out" rows="8" spellcheck="false"></textarea>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</main>
<script type="module" src="/js/diff.js"></script>
</body>
</html>
